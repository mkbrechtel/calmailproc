[package]
name = "calmailproc"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Calendar mail processor: stores iCalendar invitations from emails on a CalDAV server"
license = "Apache-2.0"
repository = "https://github.com/mkbrechtel/calmailproc"

[dependencies]
mail-parser = "1.0"
icalendar = "0.17"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
base64 = "0.23"
chrono = { version = "0.4.45", default-features = false, features = ["now"] }
